<!DOCTYPE html>
<html lang="en" data-theme="default">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SOAR — Staff Board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=Nunito:wght@400;700;900&family=Pacifico&family=Creepster&family=Mountains+of+Christmas:wght@400;700&family=Bebas+Neue&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="themes/themes.css" />
</head>

<body>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div class="deco deco--tl" aria-hidden="true"></div>
  <div class="deco deco--tr" aria-hidden="true"></div>
  <div class="deco deco--bl" aria-hidden="true"></div>
  <div class="deco deco--br" aria-hidden="true"></div>

  <main class="board">

    <!-- ===== Header ===== -->
    <header class="topbar">
      <div class="brand">
        <div class="brand__mark">SOAR</div>
        <div class="brand__season" id="seasonLabel">Staff Board</div>
      </div>
      <div class="topbar__right">
        <div class="countdown" id="countdown" hidden></div>
        <div class="clock">
          <div class="clock__time" id="clockTime">—</div>
          <div class="clock__date" id="clockDate">—</div>
        </div>
      </div>
    </header>

    <!-- ===== Two-column body ===== -->
    <div class="grid">

      <!-- LEFT: This Week (top) + [QR grid · House Cup] bottom row -->
      <section class="col col--main">

        <div class="nownext" id="nowNext" hidden>
          <div class="nownext__cell nownext__cell--now">
            <span class="nownext__label">Happening now</span>
            <span class="nownext__title" id="nowTitle">—</span>
          </div>
          <div class="nownext__cell nownext__cell--next">
            <span class="nownext__label">Up next</span>
            <span class="nownext__title" id="nextTitle">—</span>
          </div>
        </div>

        <h2 class="col__title">This Week</h2>
        <div class="schedule" id="schedule"></div>

        <!-- Bottom row: Scan-to-Log QR grid (left) beside the House Cup (right).
             Fixed height; the schedule above (flex:1) clips first if space runs short. -->
        <div class="bottomrow">
          <section class="panel panel--scan">
            <h2 class="panel__title">Scan to Log</h2>
            <div class="scan" id="scan"></div>
          </section>
          <section class="panel panel--soarpoints" aria-label="House Cup">
            <iframe
              class="soarpoints-frame"
              src="https://soarpoints.web.app/display"
              title="SOAR House Cup — Live Standings"
              allowfullscreen
            ></iframe>
          </section>
        </div>

      </section>

      <!-- RIGHT: full-day duty, takes the whole column -->
      <aside class="col col--side">
        <section class="panel panel--duty">
          <h2 class="panel__title">On Duty</h2>
          <p class="panel__sub" id="dutyWeek"></p>
          <div class="duty" id="duty"></div>
        </section>
      </aside>
    </div>

    <!-- ===== Announcements ticker ===== -->
    <footer class="ticker" id="tickerWrap" hidden>
      <span class="ticker__tag">Notices</span>
      <div class="ticker__viewport">
        <div class="ticker__track" id="ticker"></div>
      </div>
    </footer>

  </main>

  <div class="stamp" id="stamp"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="effects.js"></script>
  <script src="app.js"></script>
</body>
</html>
